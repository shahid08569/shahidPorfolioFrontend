<div class="login-wrapper">
  <div class="login-card card">
    <div class="login-header">
      <div class="login-brand-icon">
        <app-icon name="terminal" [size]="28"></app-icon>
      </div>
      <h1 class="login-title">Portfolio CMS Portal</h1>
      <p class="login-subtitle">Sign in to manage projects, skills, articles, and settings.</p>
    </div>

    <!-- Error Alert -->
    <div class="alert alert-error" *ngIf="errorMessage()">
      <span>{{ errorMessage() }}</span>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email" class="form-label">Admin Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="admin@example.com"
          class="form-control"
          [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          autocomplete="email"
        />
        <span class="field-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Valid email required.
        </span>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-input-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••••••"
            class="form-control"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [title]="showPassword() ? 'Hide password' : 'Show password'"
            tabindex="-1"
          >
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18"></app-icon>
          </button>
        </div>
        <span class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required.
        </span>
      </div>

      <div class="form-options">
        <label class="remember-label">
          <input type="checkbox" formControlName="rememberMe" class="remember-checkbox" />
          <span>Remember me on this device</span>
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary submit-btn" [disabled]="isLoading()">
          <span *ngIf="!isLoading()">
            Sign In to Dashboard
            <app-icon name="arrow-right" [size]="16"></app-icon>
          </span>
          <span *ngIf="isLoading()">Verifying Credentials...</span>
        </button>
      </div>
    </form>

    <div class="back-home">
      <a routerLink="/" class="home-link">← Return to Public Portfolio</a>
    </div>
  </div>
</div>
